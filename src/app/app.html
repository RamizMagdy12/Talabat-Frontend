<style>
  header {
    background: #34495e;
    color: white;
    padding: 20px;
    margin-bottom: 20px;
  }

  header a:hover {
    color: #f8f9fa;
  }
</style>
<main>
  <header class="d-flex justify-content-between align-items-center px-4">
    <h1 class="m-0">
      <a routerLink="/" class="text-white text-decoration-none">Talabat Store</a>
    </h1>

    <div class="d-flex align-items-center gap-3">
      <a routerLink="/" class="btn btn-outline-light d-flex align-items-center">
        <i class="fa fa-home me-2"></i> Home
      </a>

      <ng-container *ngIf="(accountService.currentUser$ | async) === null">
        <a routerLink="/account/login" class="btn btn-outline-light d-flex align-items-center">
          <i class="fa fa-sign-in-alt me-2"></i> Login
        </a>
      </ng-container>

      <ng-container *ngIf="(accountService.currentUser$ | async) as user">
        <a routerLink="/orders" class="btn btn-outline-light d-flex align-items-center">
          <i class="fa fa-list-alt me-2"></i> My Orders
        </a>
        <a (click)="logout()" class="btn btn-outline-danger d-flex align-items-center" style="cursor: pointer;">
          <i class="fa fa-sign-out-alt me-2"></i> Logout
        </a>
      </ng-container>

      <a routerLink="/basket" class="btn btn-outline-light position-relative d-flex align-items-center">
        <i class="fa fa-shopping-cart me-2"></i> Basket
        <span *ngIf="(basketService.basketSource$ | async) as basket"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light">
          {{basket.items.length}}
        </span>
      </a>
    </div>
  </header>
  <router-outlet></router-outlet>
</main>
