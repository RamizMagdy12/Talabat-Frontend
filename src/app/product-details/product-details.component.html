<section class="detail-page" *ngIf="product; else loading">
  <a routerLink="/products" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"></path>
      <path d="m12 19-7-7 7-7"></path>
    </svg>
    Back to products
  </a>

  <div class="detail-card">
    <div class="detail-media">
      <img [src]="product.pictureUrl" [alt]="product.name" />
    </div>
    <div class="detail-info">
      <p class="detail-brand">{{ product.brand }}</p>
      <h1>{{ product.name }}</h1>
      <p class="detail-price">{{ product.price | currency }}</p>
      <div class="detail-tags">
        <span>{{ product.brand }}</span>
        <span>{{ product.category }}</span>
      </div>
      <p class="detail-desc">{{ product.description }}</p>
      <div class="detail-actions">
        <button type="button" class="btn-solid" (click)="addItemToBasket()">Add to cart</button>
        <a routerLink="/products" class="btn-ghost">Keep shopping</a>
      </div>
    </div>
  </div>
</section>

<ng-template #loading>
  <section class="detail-page">
    <div class="detail-loading">Loading product…</div>
  </section>
</ng-template>
