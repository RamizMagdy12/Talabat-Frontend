<section class="auth-stage">
  <div class="auth-orb auth-orb--a" aria-hidden="true"></div>
  <div class="auth-orb auth-orb--b" aria-hidden="true"></div>
  <div class="auth-orb auth-orb--c" aria-hidden="true"></div>
  <div class="auth-grid" aria-hidden="true"></div>

  <div class="auth-layout">
    <aside class="auth-brand panel-in">
      <div class="auth-brand__mark">T</div>
      <h1 class="auth-brand__title">{{ 'app.name' | t }}</h1>
      <p class="auth-brand__tag">{{ 'forgot.brandTag' | t }}</p>
      <ul class="auth-brand__points">
        <li>{{ 'forgot.point1' | t }}</li>
        <li>{{ 'forgot.point2' | t }}</li>
        <li>{{ 'forgot.point3' | t }}</li>
      </ul>
    </aside>

    <div class="auth-card panel-in panel-in--delay">
      <div class="auth-card__head">
        <h2>{{ 'forgot.title' | t }}</h2>
        <p>{{ 'forgot.sub' | t }}</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>{{ 'login.email' | t }}</span>
          <input type="email" formControlName="email" autocomplete="username" placeholder="you@email.com"
            [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid"
            [class.is-valid]="form.get('email')?.touched && form.get('email')?.valid" />
          <small class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
            {{ 'validation.emailRequired' | t }}
          </small>
          <small class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
            {{ 'validation.emailInvalid' | t }}
          </small>
        </label>

        <button class="auth-submit" type="submit" [disabled]="form.invalid || isSubmitting">
          <span>{{ (isSubmitting ? 'forgot.sending' : 'forgot.submit') | t }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <p class="auth-switch">
        {{ 'forgot.remembered' | t }}
        <a routerLink="/account/login">{{ 'forgot.back' | t }}</a>
      </p>
    </div>
  </div>
</section>
