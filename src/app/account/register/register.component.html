<section class="auth-stage">
  <div class="auth-orb auth-orb--a" aria-hidden="true"></div>
  <div class="auth-orb auth-orb--b" aria-hidden="true"></div>
  <div class="auth-orb auth-orb--c" aria-hidden="true"></div>
  <div class="auth-grid" aria-hidden="true"></div>

  <div class="auth-layout auth-layout--register">
    <aside class="auth-brand panel-in">
      <div class="auth-brand__mark">T</div>
      <h1 class="auth-brand__title">{{ 'app.name' | t }}</h1>
      <p class="auth-brand__tag">{{ 'register.brandTag' | t }}</p>
    </aside>

    <div class="auth-card panel-in panel-in--delay">
      <div class="auth-card__head">
        <h2>{{ 'register.title' | t }}</h2>
        <p>{{ 'register.sub' | t }}</p>
      </div>

      <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="field-row">
          <label class="field">
            <span>{{ 'profile.displayName' | t }}</span>
            <input type="text" formControlName="displayName" [placeholder]="'register.namePh' | t"
              [class.is-invalid]="registerForm.get('displayName')?.touched && registerForm.get('displayName')?.invalid" />
            <small class="field-error" *ngIf="registerForm.get('displayName')?.touched && registerForm.get('displayName')?.hasError('required')">{{ 'common.required' | t }}</small>
          </label>
          <label class="field">
            <span>{{ 'profile.username' | t }}</span>
            <input type="text" formControlName="userName" [placeholder]="'register.usernamePh' | t"
              [class.is-invalid]="registerForm.get('userName')?.touched && registerForm.get('userName')?.invalid" />
            <small class="field-error" *ngIf="registerForm.get('userName')?.touched && registerForm.get('userName')?.hasError('required')">{{ 'common.required' | t }}</small>
          </label>
        </div>

        <label class="field">
          <span>{{ 'login.email' | t }}</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@email.com"
            [class.is-invalid]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" />
          <small class="field-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">{{ 'validation.emailRequired' | t }}</small>
          <small class="field-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email')">{{ 'validation.emailInvalid' | t }}</small>
          <small class="field-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('emailExists')">{{ 'register.emailTaken' | t }}</small>
        </label>

        <label class="field">
          <span>{{ 'profile.phone' | t }}</span>
          <input type="text" formControlName="phoneNumber" placeholder="01xxxxxxxxx"
            [class.is-invalid]="registerForm.get('phoneNumber')?.touched && registerForm.get('phoneNumber')?.invalid" />
          <small class="field-error" *ngIf="registerForm.get('phoneNumber')?.touched && registerForm.get('phoneNumber')?.hasError('required')">{{ 'validation.phoneRequired' | t }}</small>
        </label>

        <label class="field">
          <span>{{ 'login.password' | t }}</span>
          <div class="password-box"
            [class.is-invalid]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" placeholder="••••••••" />
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="(showPassword ? 'common.hidePassword' : 'common.showPassword') | t">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <small class="field-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required')">{{ 'validation.passwordRequired' | t }}</small>
          <small class="field-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('pattern')">
            {{ 'register.passwordHint' | t }}
          </small>
        </label>

        <button class="auth-submit" type="submit" [disabled]="registerForm.invalid || registerForm.pending">
          <span>{{ 'register.submit' | t }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <p class="auth-switch">
        {{ 'register.haveAccount' | t }}
        <a routerLink="/account/login">{{ 'register.signIn' | t }}</a>
      </p>
    </div>
  </div>
</section>
