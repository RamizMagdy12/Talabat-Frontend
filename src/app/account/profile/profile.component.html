<section class="profile-page">
  <header class="profile-hero">
    <div>
      <p class="shop-kicker">{{ 'footer.account' | t }}</p>
      <h1>{{ 'profile.title' | t }}</h1>
      <p class="profile-hero__sub">{{ 'profile.sub' | t }}</p>
    </div>
  </header>

  <div class="profile-loading" *ngIf="isLoading">{{ 'common.loading' | t }}</div>

  <div class="profile-grid" *ngIf="!isLoading">
    <form class="profile-card" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="profile-card__head">
        <h2>{{ 'profile.personal' | t }}</h2>
        <p>{{ 'profile.personalSub' | t }}</p>
      </div>

      <div class="field-row">
        <label class="field">
          <span>{{ 'profile.displayName' | t }}</span>
          <input type="text" formControlName="displayName" />
          <small class="field-error" *ngIf="profileForm.get('displayName')?.touched && profileForm.get('displayName')?.invalid">{{ 'common.required' | t }}</small>
        </label>
        <label class="field">
          <span>{{ 'profile.phone' | t }}</span>
          <input type="text" formControlName="phoneNumber" placeholder="01xxxxxxxxx" />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>{{ 'profile.email' | t }}</span>
          <input type="email" formControlName="email" />
        </label>
        <label class="field">
          <span>{{ 'profile.username' | t }}</span>
          <input type="text" formControlName="userName" />
        </label>
      </div>

      <h3 class="profile-section-title">{{ 'profile.address' | t }}</h3>
      <div class="field-row">
        <label class="field">
          <span>{{ 'checkout.firstName' | t }}</span>
          <input type="text" formControlName="firstName" />
        </label>
        <label class="field">
          <span>{{ 'checkout.lastName' | t }}</span>
          <input type="text" formControlName="lastName" />
        </label>
      </div>
      <label class="field">
        <span>{{ 'checkout.street' | t }}</span>
        <input type="text" formControlName="street" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>{{ 'checkout.city' | t }}</span>
          <input type="text" formControlName="city" />
        </label>
        <label class="field">
          <span>{{ 'checkout.country' | t }}</span>
          <input type="text" formControlName="country" />
        </label>
      </div>

      <button class="btn-solid" type="submit" [disabled]="profileForm.invalid || isSaving">
        {{ isSaving ? ('profile.saving' | t) : ('profile.save' | t) }}
      </button>
    </form>

    <form class="profile-card" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="profile-card__head">
        <h2>{{ 'profile.password' | t }}</h2>
        <p>{{ 'profile.passwordSub' | t }}</p>
      </div>

      <label class="field">
        <span>{{ 'profile.currentPassword' | t }}</span>
        <div class="password-box">
          <input [type]="showCurrentPassword ? 'text' : 'password'" formControlName="currentPassword" autocomplete="current-password" />
          <button type="button" class="password-toggle" (click)="showCurrentPassword = !showCurrentPassword" [attr.aria-label]="(showCurrentPassword ? 'common.hidePassword' : 'common.showPassword') | t">
            <svg *ngIf="!showCurrentPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showCurrentPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </label>

      <label class="field">
        <span>{{ 'profile.newPassword' | t }}</span>
        <div class="password-box">
          <input [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" />
          <button type="button" class="password-toggle" (click)="showNewPassword = !showNewPassword" [attr.aria-label]="(showNewPassword ? 'common.hidePassword' : 'common.showPassword') | t">
            <svg *ngIf="!showNewPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showNewPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <small class="field-error" *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.hasError('pattern')">
          {{ 'profile.passwordHint' | t }}
        </small>
      </label>

      <label class="field">
        <span>{{ 'profile.confirmPassword' | t }}</span>
        <div class="password-box">
          <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
          <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="(showConfirmPassword ? 'common.hidePassword' : 'common.showPassword') | t">
            <svg *ngIf="!showConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirmPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </label>

      <button class="btn-solid" type="submit" [disabled]="passwordForm.invalid || isChangingPassword">
        {{ isChangingPassword ? ('profile.saving' | t) : ('profile.updatePassword' | t) }}
      </button>
    </form>
  </div>
</section>
