<section class="auth-stage">
  <div class="auth-orb auth-orb--a" aria-hidden="true"></div>
  <div class="auth-orb auth-orb--b" aria-hidden="true"></div>
  <div class="auth-orb auth-orb--c" aria-hidden="true"></div>
  <div class="auth-grid" aria-hidden="true"></div>

  <div class="auth-layout">
    <aside class="auth-brand panel-in">
      <div class="auth-brand__mark">T</div>
      <h1 class="auth-brand__title">{{ 'app.name' | t }}</h1>
      <p class="auth-brand__tag">{{ 'login.brandTag' | t }}</p>
      <ul class="auth-brand__points">
        <li>{{ 'login.point1' | t }}</li>
        <li>{{ 'login.point2' | t }}</li>
        <li>{{ 'login.point3' | t }}</li>
      </ul>
    </aside>

    <div class="auth-card panel-in panel-in--delay">
      <div class="auth-card__head">
        <h2>{{ 'login.title' | t }}</h2>
        <p>{{ 'login.sub' | t }}</p>
      </div>

      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <label class="field">
          <span>{{ 'login.email' | t }}</span>
          <input type="email" formControlName="email" autocomplete="username" placeholder="you@email.com"
            [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
            [class.is-valid]="loginForm.get('email')?.touched && loginForm.get('email')?.valid" />
          <small class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
            {{ 'validation.emailRequired' | t }}
          </small>
          <small class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
            {{ 'validation.emailInvalid' | t }}
          </small>
        </label>

        <label class="field">
          <span>{{ 'login.password' | t }}</span>
          <div class="password-box"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            [class.is-valid]="loginForm.get('password')?.touched && loginForm.get('password')?.valid">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="(showPassword ? 'common.hidePassword' : 'common.showPassword') | t">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <small class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
            {{ 'validation.passwordRequired' | t }}
          </small>
        </label>

        <div class="auth-forgot">
          <a routerLink="/account/forgot-password">{{ 'login.forgot' | t }}</a>
        </div>

        <button class="auth-submit" type="submit" [disabled]="loginForm.invalid">
          <span>{{ 'login.submit' | t }}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"></path>
            <path d="m13 5 7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <p class="auth-switch">
        {{ 'login.noAccount' | t }}
        <a routerLink="/account/register">{{ 'login.registerLink' | t }}</a>
      </p>
    </div>
  </div>
</section>
