<div class="d-flex justify-content-center mt-5">
    <div class="col-4">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="text-center mb-4">
                <h1 class="h3 mb-3 fw-normal">Login</h1>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" formControlName="email"
                    [ngClass]="(loginForm.get('email')?.touched) ? loginForm.get('email')?.invalid ? 'is-invalid' : 'is-valid' : ''"
                    id="floatingInput" placeholder="name@example.com">
                <label for="floatingInput">Email address</label>
                <div class="invalid-feedback" *ngIf="loginForm.get('email')?.hasError('required')">
                    Email address is required
                </div>
                <div class="invalid-feedback" *ngIf="loginForm.get('email')?.hasError('email')">
                    Invalid email address
                </div>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" formControlName="password"
                    [ngClass]="(loginForm.get('password')?.touched) ? loginForm.get('password')?.invalid ? 'is-invalid' : 'is-valid' : ''"
                    id="floatingPassword" placeholder="Password">
                <label for="floatingPassword">Password</label>
                <div class="invalid-feedback" *ngIf="loginForm.get('password')?.hasError('required')">
                    Password is required
                </div>
            </div>

            <button [disabled]="loginForm.invalid" class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
            <div class="mt-3 text-center">
                <p>Don't have an account? <a routerLink="/account/register">Register</a></p>
            </div>
        </form>
    </div>
</div>
